name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Studio for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller studio.spec --clean --noconfirm

      - name: Copy template config
        shell: pwsh
        run: |
          if (Test-Path ".env.example") {
            Copy-Item ".env.example" -Destination "dist\Studio\.env.example"
          }

      - name: Compress to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Studio" -DestinationPath "dist\Studio-Windows.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Windows
          path: dist/Studio-Windows.zip
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Studio Build' }}
          prerelease: false
          files: dist/Studio-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
