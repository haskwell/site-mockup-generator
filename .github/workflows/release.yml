name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Studio App Executable (PyInstaller)
        run: |
          pyinstaller studio.spec --clean --noconfirm

      - name: Prepare distribution directory
        run: |
          if (Test-Path ".env.example") {
            Copy-Item -Path ".env.example" -Destination "dist\Studio\.env.example" -Force
          }
        shell: powershell

      - name: Compress Studio package into ZIP
        run: |
          Compress-Archive -Path "dist\Studio\*" -DestinationPath "dist\Studio-Windows-x64.zip" -Force
        shell: powershell

      - name: Build Standalone Single-File GUI Installer (StudioInstaller.exe)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "StudioInstaller" --icon "assets/studio.ico" scripts/installer_gui.py
        shell: powershell

      - name: Determine Release Tag
        id: release_tag
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.event.inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Studio ${{ steps.release_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Studio-Windows-x64.zip
            dist/StudioInstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
